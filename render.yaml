# Render Blueprint for the PlateVision API (backend only).
# Deploy: push to GitHub, then New → Blueprint in the Render dashboard and pick
# this repo. The same Dockerfile also runs as-is on Railway or Fly.io.
#
# NOTE ON RESOURCES: torch + paddlepaddle + the YOLO model use ~1.5 GB RAM at
# runtime. Render's free and starter tiers are both 512 MB and will OOM on load,
# so this uses "standard" (2 GB). Same idea on Railway/Fly: give it >= 2 GB.

services:
  - type: web
    name: platevision-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: standard
    # /health returns 200 immediately (ready:false while the model warms up),
    # so the service goes live without waiting on the ~10 s model load.
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # Routes stay at the root (/health, /detect). No prefix is needed when the
      # API has its own domain — that's only for the single-domain Vercel setup.
      - key: API_PREFIX
        value: ""
      # Return the annotated image as an inline data URI instead of a /media URL.
      # Correct for a split deploy: the browser never has to fetch media
      # cross-origin from this host, and it survives an ephemeral filesystem.
      - key: INLINE_IMAGES
        value: "true"
      # Browser origin allowed to call this API. REPLACE with your real Vercel
      # domain once the frontend is deployed (e.g. https://platevision.vercel.app).
      # A wildcard also works but is broader than needed.
      - key: CORS_ORIGINS
        value: https://YOUR-APP.vercel.app
      # Baked-in PaddleOCR weights (see Dockerfile) and a writable cache.
      - key: PADDLE_MODEL_DIR
        value: /opt/paddle
      - key: PADDLE_CACHE_DIR
        value: /tmp/paddle
